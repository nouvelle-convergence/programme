k-text role-title-text" role="graphics-symbol" aria-roledescription="title" aria-label="Title text 'La pension de départ de celui qui prend sa retraite cette année-là'" pointer-events="none"><text text-anchor="start" transform="translate(0,13)" font-family="system-ui, sans-serif" font-size="16px" font-weight="bold" fill="#000" opacity="1">La pension de départ de celui qui prend sa retraite cette année-là</text></g><g class="mark-text role-title-subtitle" role="graphics-symbol" aria-roledescription="subtitle" aria-label="Subtitle text 'Pour une carrière qui vaut 1 500 € de pension aujourd’hui, en euros d’aujourd’hui, les salaires progressant de 1 % par an. Le frein de Nouvelle Convergence ralentit cette pension de départ, d’un point par an au plus, et la relâche quand les comptes le permettent. Rente des comptes par capitalisation comprise (Les Républicains, Nouvelle Énergie), rendement prudent.'" pointer-events="none"><text text-anchor="start" transform="translate(0,31)" font-family="system-ui, sans-serif" font-size="12px" fill="#6b6f7b" opacity="1"><tspan>Pour une carrière qui vaut 1 500 € de pension aujourd’hui, en euros d’aujourd’hui, les salaires</tspan><tspan x="0" dy="14">progressant de 1 % par an. Le frein de Nouvelle Convergence ralentit cette pension de départ,</tspan><tspan x="0" dy="14">d’un point par an au plus, et la relâche quand les comptes le permettent. Rente des comptes par</tspan><tspan x="0" dy="14">capitalisation comprise (Les Républicains, Nouvelle Énergie), rendement prudent.</tspan></text></g></g><path class="foreground" aria-hidden="true" d="" pointer-events="none" display="none"/></g></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g></g></svg>
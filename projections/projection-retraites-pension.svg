h class="foreground" aria-hidden="true" d="" pointer-events="none" display="none"/></g></g><g class="mark-group role-title"><g transform="translate(-63,-106)"><path class="background" aria-hidden="true" d="M0,0h0v0h0Z" pointer-events="none"/><g><g class="mark-text role-title-text" role="graphics-symbol" aria-roledescription="title" aria-label="Title text 'Une pension de 1 500 € aujourd’hui : ce qu’elle vaut chaque année'" pointer-events="none"><text text-anchor="start" transform="translate(0,13)" font-family="system-ui, sans-serif" font-size="16px" font-weight="bold" fill="#000" opacity="1">Une pension de 1 500 € aujourd’hui : ce qu’elle vaut chaque année</text></g><g class="mark-text role-title-subtitle" role="graphics-symbol" aria-roledescription="subtitle" aria-label="Subtitle text 'Pouvoir d’achat en euros d’aujourd’hui d’une personne déjà à la retraite. Le NFP indexe les pensions sur les salaires, sans financement prévu. Nouvelle Énergie désindexe celles au-dessus de 2 000 € brut par mois jusqu’à ce qu’elles retombent à ce seuil : une pension de 2 700 € perd jusqu’à 25,93 % ; une pension de 1 500 € n’est pas touchée. Le frein de Nouvelle Convergence ne touche jamais une pension déjà liquidée.'" pointer-events="none"><text text-anchor="start" transform="translate(0,31)" font-family="system-ui, sans-serif" font-size="12px" fill="#6b6f7b" opacity="1"><tspan>Pouvoir d’achat en euros d’aujourd’hui d’une personne déjà à la retraite. Le NFP indexe les</tspan><tspan x="0" dy="14">pensions sur les salaires, sans financement prévu. Nouvelle Énergie désindexe celles au-dessus</tspan><tspan x="0" dy="14">de 2 000 € brut par mois jusqu’à ce qu’elles retombent à ce seuil : une pension de 2 700 € perd</tspan><tspan x="0" dy="14">jusqu’à 25,93 % ; une pension de 1 500 € n’est pas touchée. Le frein de Nouvelle Convergence ne</tspan><tspan x="0" dy="14">touche jamais une pension déjà liquidée.</tspan></text></g></g><path class="foreground" aria-hidden="true" d="" pointer-events="none" display="none"/></g></g></g><path class="foreground" aria-hidden="true" d="" display="none"/></g></g></g></svg>